name: Release Drafter

on:
  push:
    branches:
      - main
  # Run manually right before publishing to refresh the CalVer version if the
  # year has rolled over since the last push to main.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update_release_draft:
    name: Update release draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # to create/update the draft release
    steps:
      # Let the version-resolver decide between a MINOR and a MICRO bump
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        id: semver
        with:
          dry-run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute CalVer version
        id: calver
        env:
          MAJOR: ${{ steps.semver.outputs.major_version }}
          RESOLVED: ${{ steps.semver.outputs.resolved_version }}
        run: |
          year="$(date -u +%y)"
          if [ "${MAJOR}" = "${year}" ]; then
            version="${RESOLVED}"
          else
            # First release of the year
            version="${year}.1.0"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          version: ${{ steps.calver.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

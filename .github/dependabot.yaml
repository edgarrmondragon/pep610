version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      timezone: America/Mexico_City
    # Setting labels replaces Dependabot's defaults, so keep them alongside skip-changelog
    labels:
      - "dependencies"
      - "github_actions"
      - "skip-changelog"
    assignees:
      - "edgarrmondragon"
    commit-message:
      prefix: "ci: "
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
